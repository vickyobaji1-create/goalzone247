  :root {

    --border: #2b343a;

    --muted: #aab6bc;

}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  width: 100%;
  overflow-x: clip;
}

body {
  font-family: 'Archivo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--text);
  background: var(--bg);
  font-weight: 700;
  -webkit-font-smoothing: antialiased;
}

section, header, footer, nav, article, div {
  box-sizing: border-box;
}

section, header, footer {
  width: 100%;
  overflow-x: clip;
}

  font-weight: 800;

  cursor: pointer;

input, select {

}

input:focus, select:focus {
  border-color: var(--green) !important;
}

@keyframes spinOnce {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.spin {
  animation: spinOnce .7s ease;
}

@keyframes pulseDot {
  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}

.live-dot {
  animation: pulseDot 1.2s infinite;
}

/* Market Accumulators 6+6 — fit-to-screen grid, 6px gaps only.
   Grid rows must fully contain their cards: no card may spill past the
   row's bottom edge into the ad that follows the grid. */

.acc-grid {
  display: grid;
  width: 100%;
  min-width: 0;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  align-items: stretch;
  margin: 0;
  padding: 0;
  overflow: visible;
  clear: both;
  position: static;
  z-index: auto;
  transform: none;
}

.acc-grid > * {
  min-width: 0;
  align-self: stretch;
  margin-bottom: 0;
}

/* Advertisement cards — separate full-width rows, never inside a card
   grid, never overlapping. Each ad is its own block with a clear gap
   above and below it. */

.ad-slot {
  display: block;
  width: 100%;
  clear: both;
  position: static;
  z-index: auto;
  margin: 0;
  padding: 0;
  transform: none;
}

.ad-row {
  display: block;
  width: 100%;
  clear: both;
  position: static;
  z-index: auto;
  margin: 14px 0;
  padding: 16px 12px;
  transform: none;
  box-sizing: border-box;
}

@media (max-width: 1024px) {
  .acc-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 640px) {
  .acc-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 380px) {
  .acc-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Header — GOALZONE247 must stay together on ONE line, never split 24 / 7 */

.header-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
}

.brand-wrap {
  flex: 1 1 auto;
  min-width: 0;
}

.brand-word {
  white-space: nowrap;
  word-break: keep-all;
  overflow-wrap: normal;
  font-size: 28px;
  line-height: 1;
  letter-spacing: -0.02em;
  font-weight: 900;
}

.brand-word .brand-num {
  color: var(--green);
}

.preview-pill {
  flex-shrink: 0;
  white-space: nowrap;
}

@media (max-width: 768px) {
  .brand-word {
    font-size: 24px;
  }
}

@media (max-width: 480px) {
  .brand-word {
    font-size: 20px;
  }
}

@media (max-width: 360px) {
  .brand-word {
    font-size: 18px;
  }
}

/* Available Matches — 12 markets, 4 per line x 3 lines on ALL screen sizes */

.match-grid {
  display: grid;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}

.match-grid > * {
  min-width: 0;
}
