/* Market Accumulators 6+6 — fit-to-screen grid, 6px gaps only.
   Grid rows must fully contain their cards: no card may spill past the
   row's bottom edge into the ad that follows the grid. */

.acc-grid {
  display: grid;
  width: 100%;
  min-width: 0;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  align-items: stretch;
  margin: 0;
  padding: 0;
  overflow: visible;
  clear: both;
  position: static;
  z-index: auto;
  transform: none;
}

.acc-grid > * {
  min-width: 0;
  align-self: stretch;
  margin-bottom: 0;
}

/* Advertisement cards — separate full-width rows, never inside a card
   grid, never overlapping. Each ad is its own block with a clear gap
   above and below it. */

.ad-slot {
  display: block;
  width: 100%;
  clear: both;
  position: static;
  z-index: auto;
  margin: 0;
  padding: 0;
  transform: none;
}

.ad-row {
  display: block;
  width: 100%;
  clear: both;
  position: static;
  z-index: auto;
  margin: 14px 0;
  padding: 16px 12px;
  transform: none;
  box-sizing: border-box;
}
