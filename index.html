.text-\[19px\]{
  font-size: 19px;
}

.text-\[20px\]{
  font-size: 20px;
}

.text-\[8px\]{
  font-size: 8px;
}

.text-\[9px\]{
  font-size: 9px;
}

.font-black{
  font-weight: 900;
}

.font-bold{
  font-weight: 700;
}

.font-extrabold{
  font-weight: 800;
}

.leading-\[1\.15\]{
  line-height: 1.15;
}

.leading-relaxed{
  line-height: 1.625;
}

.leading-snug{
  line-height: 1.375;
}

.leading-tight{
  line-height: 1.25;
}

.tracking-\[0\.18em\]{
  letter-spacing: 0.18em;
}

.tracking-tight{
  letter-spacing: -0.025em;
}

.tracking-wide{
  letter-spacing: 0.025em;
}

.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.opacity-95{
  opacity: 0.95;
}

.shadow-2xl{
  --tw-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --tw-shadow-colored: 0 25px 50px -12px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-lg{
  --tw-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 10px 15px -3px var(--tw-shadow-color), 0 4px 6px -4px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.\[overflow-wrap\:anywhere\]{
  overflow-wrap: anywhere;
}

:root {
  --bg: #0f1417;
  --bg2: #141a1e;
  --card: #1a2126;
  --card2: #20282e;
  --border: #2b343a;
  --border2: #36424a;
  --text: #ffffff;
  --muted: #aab6bc;
  --muted2: #7d8a90;
  --green: #28d17c;
  --green2: #2ee06f;
  --gold: #f2bd54;
  --red: #ff6b6b;
  --amber: #f2bd54;
  --safe-area-inset-top: 0px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1417;
    --bg2: #141a1e;
    --card: #1a2126;
    --card2: #20282e;
    --border: #2b343a;
    --text: #ffffff;
    --muted: #aab6bc;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  width: 100%;
  overflow-x: clip;
}

body {
  font-family: 'Archivo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--text);
  background: var(--bg);
  font-weight: 700;
  -webkit-font-smoothing: antialiased;
}

section, header, footer, nav, article, div {
  box-sizing: border-box;
}

section, header, footer {
  width: 100%;
  overflow-x: clip;
}

h1, h2, h3 {
  font-weight: 800;
}

.mono {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
}

button, input, select {
  font-family: inherit;
  min-width: 0;
  font-weight: 700;
}

button {
  cursor: pointer;
}

input, select {
  outline: none;
}

input:focus, select:focus {
  border-color: var(--green) !important;
}

@keyframes spinOnce {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.spin {
  animation: spinOnce .7s ease;
}

@keyframes pulseDot {
  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}

.live-dot {
  animation: pulseDot 1.2s infinite;
}

/* Market Accumulators 6+6 — fit-to-screen grid, 6px gaps only.
   Grid rows must fully contain their cards: no card may spill past the
   row's bottom edge into the ad that follows the grid. */

.acc-grid {
  display: grid;
  width: 100%;
  min-width: 0;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  align-items: stretch;
  margin: 0;
  padding: 0;
  overflow: visible;
  clear: both;
  position: static;
  z-index: auto;
  transform: none;
}

.acc-grid > * {
  min-width: 0;
  align-self: stretch;
  margin-bottom: 0;
}

/* Advertisement cards — separate full-width rows, never inside a card
   grid, never overlapping. Each ad is its own block with a clear gap
   above and below it. */

.ad-slot {
  display: block;
  width: 100%;
  clear: both;
  position: static;
  z-index: auto;
  margin: 0;
  padding: 0;
  transform: none;
}

.ad-row {
  display: block;
  width: 100%;
  clear: both;
  position: static;
  z-index: auto;
  margin: 14px 0;
  padding: 16px 12px;
  transform: none;
  box-sizing: border-box;
}

@media (max-width: 1024px) {
  .acc-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 640px) {
  .acc-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 380px) {
  .acc-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Header — GOALZONE247 must stay together on ONE line, never split 24 / 7 */

.header-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
}

.brand-wrap {
  flex: 1 1 auto;
  min-width: 0;
}

.brand-word {
  white-space: nowrap;
  word-break: keep-all;
  overflow-wrap: normal;
  font-size: 28px;
  line-height: 1;
  letter-spacing: -0.02em;
  font-weight: 900;
}

.brand-word .brand-num {
  color: var(--green);
}



@media (max-width: 768px) {
  .brand-word {
    font-size: 24px;
  }
}

@media (max-width: 480px) {
  .brand-word {
    font-size: 20px;
  }
}

@media (max-width: 360px) {
  .brand-word {
    font-size: 18px;
  }
}

/* Available Matches — 12 markets, 4 per line x 3 lines on ALL screen sizes */

.match-grid {
  display: grid;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}

.match-grid > * {
  min-width: 0;
}

.placeholder\:text-\[\#7d8a90\]::-moz-placeholder{
  --tw-text-opacity: 1;
  color: rgb(125 138 144 / var(--tw-text-opacity, 1));
}

.placeholder\:text-\[\#7d8a90\]::placeholder{
  --tw-text-opacity: 1;
  color: rgb(125 138 144 / var(--tw-text-opacity, 1));
}

@media (min-width: 420px){
  .min-\[420px\]\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }

  .sm\:basis-auto{
    flex-basis: auto;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:justify-end{
    justify-content: flex-end;
  }

  .sm\:text-right{
    text-align: right;
  }

  .sm\:text-\[20px\]{
    font-size: 20px;
  }
}

<!-- GOALZONE247 10-DAY HISTORY PATCH - Paste this just before </body> in index.html -->
<!-- It adds: Date bar (Today + last 10 days) + Fetch cards from Supabase via /api/history?date=YYYY-MM-DD -->
<style>
#gz-history-bar{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#0f1115;border-bottom:2px solid #22c55e;position:sticky;top:0;z-index:99}
.gz-day-btn{flex:0 0 auto;padding:8px 12px;border-radius:999px;border:1px solid #333;background:#1a1d24;color:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.gz-day-btn.active{background:#22c55e;color:#000;border-color:#22c55e}
.gz-day-btn small{display:block;font-weight:400;font-size:11px;opacity:.8}
#gz-history-note{text-align:center;padding:8px;font-size:13px;color:#fbbf24;background:#111}
#gz-history-empty{text-align:center;padding:20px;color:#fff}
</style>
<div id="gz-history-bar"></div>
<div id="gz-history-note"></div>
<script>
(function(){
  // Build last 10 days: Today + 9 days back
  var bar = document.getElementById('gz-history-bar');
  var note = document.getElementById('gz-history-note');
  if(!bar) return;
  var days = [];
  for(var i=0;i<10;i++){
    var d = new Date(); d.setDate(d.getDate()-i);
    var yyyy = d.getFullYear();
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    var iso = yyyy+'-'+mm+'-'+dd;
    var label = i===0 ? 'Today' : (i===1 ? 'Yesterday' : d.toLocaleDateString('en-GB',{weekday:'short'}));
    days.push({iso:iso, label:label, show: dd+'/'+mm});
  }
  var selected = days[0].iso;
  function renderBar(){
    bar.innerHTML='';
    days.forEach(function(day){
      var b=document.createElement('button');
      b.className='gz-day-btn'+(day.iso===selected?' active':'');
      b.innerHTML=day.label+'<small>'+day.show+'</small>';
      b.onclick=function(){ selected=day.iso; renderBar(); loadHistory(day.iso); };
      bar.appendChild(b);
    });
  }
  function loadHistory(dateStr){
    note.textContent='Loading '+dateStr+' accumulator cards from Supabase...';
    fetch('/api/history?date='+dateStr)
      .then(function(r){return r.json();})
      .then(function(data){
        var cards = data.cards || [];
        note.textContent = 'Showing '+dateStr+' - '+cards.length+' accumulator cards from Supabase (no API call)';
        // If your page has a container for accumulator cards, we render history cards there.
        // We look for common containers, else we show a history section at top.
        var container = document.getElementById('gz-history-cards');
        if(!container){
          container=document.createElement('div');
          container.id='gz-history-cards';
          container.style.padding='10px';
          bar.after(container);
        }
        if(!cards.length){
          container.innerHTML='<div id="gz-history-empty">No saved cards for '+dateStr+' yet. Cards are saved at 00:00 every day. Check back after 00:00.</div>';
          return;
        }
        var html='';
        cards.forEach(function(c,idx){
          var legs=[]; try{ legs=typeof c.legs==='string'?JSON.parse(c.legs):(c.legs||[]);}catch(e){legs=[];}
          var legsHtml=legs.map(function(l,n){
            var nm=(l.home||'')+' vs '+(l.away||'');
            var od=l.odds||'';
            var st=l.status||'';
            return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222;font-size:13px"><span>'+(n+1)+'. '+nm+'</span><span>'+od+' - '+st+'</span></div>';
          }).join('');
          html+='<div style="background:#1a1d24;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:10px;color:#fff"><div style="display:flex;justify-content:space-between;font-weight:800"><span>'+(idx+1)+'. '+(c.market||'')+'</span><span style="color:#22c55e">'+(c.total_odds||'')+' - Target '+(c.target||'12.00+')+'</span></div><div style="font-size:12px;color:#aaa;margin:4px 0">Result: '+(c.result||'PENDING')+' | Date: '+(c.date||dateStr)+'</div>'+legsHtml+'</div>';
        });
        container.innerHTML=html;
        // Scroll to history cards
        container.scrollIntoView({behavior:'smooth'});
      })
      .catch(function(){
        note.textContent='Could not load '+dateStr+' from Supabase. Check Vercel + Supabase are deployed.';
      });
  }
  renderBar();
  // Do NOT auto-load history on first load - show Today from normal page. History loads only when user taps a date.
})();
</script>
